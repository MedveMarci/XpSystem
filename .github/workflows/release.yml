name: Release

on:
  release:
    types: [ published ]

permissions:
  contents: write

env:
  PROJECT: XpSystem
  DEPENDENCIES: ${{ github.workspace }}/Dependencies

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download SCP:SL references
        id: references
        uses: Axwabo/scpsl-references-downloader@v1

      - name: Download LabApiExtensions
        run: |
          mkdir -p "$DEPENDENCIES"
          curl -fsSL -o "$DEPENDENCIES/LabApiExtensions.dll" \
            https://github.com/KadavasKingdom/LabApiExtensions/releases/latest/download/LabApiExtensions.dll

      - name: Build
        env:
          sl_references: ${{ steps.references.outputs.target }}
          labapi_dependencies: ${{ env.DEPENDENCIES }}
        run: dotnet build ${{ env.PROJECT }}/${{ env.PROJECT }}.csproj -c Release -o Out

      - name: Upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: Out/${{ env.PROJECT }}.dll
